[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iammenasco-blue"
version = "1.1.0"
description = "Canonical #368dda (iammenasco-blue) color tokens, WCAG helpers, and ANSI terminal escapes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Menasco" }]
requires-python = ">=3.8"
keywords = ["iammenasco", "iammenasco-blue", "color", "design-tokens", "ansi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Artistic Software",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://iammenasco.github.io/iammenasco-blue/"
Repository = "https://github.com/iammenasco/iammenasco-blue"

[project.scripts]
iammenasco-blue = "iammenasco_blue.__main__:main"

[tool.setuptools.packages.find]
include = ["iammenasco_blue*"]
